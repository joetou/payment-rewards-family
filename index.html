<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d34879"><title>週賞記・家庭版</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="family.css"></head><body>
<header><img class="campaign-banner" src="campaign-banner.png" width="2172" height="724" alt="消費-抽獎-核銷"><div class="family-heading"><h1>週賞記<span>家庭版</span></h1><button id="logout" hidden>登出</button></div><div id="connection" role="status">正在準備</div><section id="summary" aria-label="目前銀包摘要"></section></header>
<main><section id="auth" class="panel"><h2>全家一個帳號，銀包分開記</h2><p>各裝置使用同一電郵及密碼登入，即可共同管理所有家庭成員的銀包。</p><form id="login-form"><label>電郵<input id="email" type="email" autocomplete="username" required></label><label>密碼<input id="password" type="password" autocomplete="current-password" minlength="8" required></label><div class="actions"><button class="primary" id="login" type="submit">登入</button><button type="button" id="signup">建立家庭帳號</button></div><button type="button" id="forgot" class="text-button">忘記密碼</button></form><form id="password-form" hidden><label>新密碼<input id="new-password" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary" type="submit">儲存新密碼</button></form><p id="auth-message" role="status"></p></section>
<section id="workspace" hidden><div class="wallet-bar"><div id="wallet-tabs" role="tablist" aria-label="家庭成員銀包"></div><button id="add-wallet" aria-label="新增家庭成員銀包">＋銀包</button></div><div class="section-head"><h2 id="title"></h2><span class="tag">MOP 澳門元</span></div><p id="guide"></p><p id="period" class="period-note"></p><div id="content"></div><p class="privacy">家庭版的銀包及歷史紀錄儲存在雲端；使用同一帳號的家人可共同查看及修改。請勿向其他人分享密碼。</p></section></main>
<nav id="nav" aria-label="主要導覽" hidden><button data-tab="entry">◈<span>消費</span></button><button data-tab="redeem">✓<span>核銷</span></button><button data-tab="stats">▥<span>統計</span></button><button data-tab="settings">☷<span>設置</span></button></nav>
<dialog id="picker"><h2 id="picker-title">選擇獎金</h2><div id="amounts"></div><button id="cancel-picker">取消</button></dialog><dialog id="name-dialog"><form id="name-form"><h2 id="name-title">新增銀包</h2><label>家庭成員名字<input id="wallet-name" maxlength="30" required></label><div class="actions"><button id="cancel-name" type="button">取消</button><button class="primary" type="submit">儲存</button></div></form></dialog><div id="status" role="status" aria-live="polite"></div>
<script src="config.js"></script><script src="core.js"></script><script src="cloud.js"></script><script src="family.js"></script></body></html>
